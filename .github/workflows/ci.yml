name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Prepare CI Artifacts
        run: |
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/release/app-release.apk ci-artifacts/Feather-Browser-Release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/Feather-Browser-Debug.apk

      - name: Upload Feather Browser APKs
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Browser-Build
          path: ci-artifacts/*
